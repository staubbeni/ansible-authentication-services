---

# Capture requested state
- include_tasks: utils/set_state.yml
  vars:
    flag: req 
    value: "{{ state }}" 
  when: client_sw_reports_generate or client_sw_facts_generate

# Check if OS not supported
# NOTE: This causes the host to fail so it won't show up the report  
- name: OS {{ ansible_facts['os_family'] }} is not supported
  block:

    - include_tasks: utils/set_state.yml
      vars:
        flag: act 
        value: failed
      when: client_sw_reports_generate or client_sw_facts_generate

    - fail:
        msg: OS {{ ansible_facts['os_family'] }} is not supported

  when: 
    - ansible_facts['os_family'] | lower not in client_sw_os_families

# Handle remove 
- name: remove {{ package }} 
  block:

    - include_tasks: os/{{ ansible_facts['os_family'] | lower }}/remove.yml

    - include_tasks: utils/set_state.yml
      vars:
        flag: act 
        value: removed
      when: client_sw_reports_generate or client_sw_facts_generate

  rescue:

    - include_tasks: utils/set_state.yml
      vars:
        flag: act 
        value: failed
      when: client_sw_reports_generate or client_sw_facts_generate

    - fail:
        msg: failed to remove {{ package }} package

  when:
    - state == 'absent'
    - hostvars[inventory_hostname]['sas_client_sw_' + package + '_vers_beg']

# Handle install
- name: install {{ package }} 
  block:

    - include_tasks: os/{{ ansible_facts['os_family'] | lower }}/install.yml

    - include_tasks: utils/set_state.yml
      vars:
        flag: act 
        value: installed 
      when: client_sw_reports_generate or client_sw_facts_generate

  rescue:

    - include_tasks: utils/set_state.yml
      vars:
        flag: act 
        value: failed
      when: client_sw_reports_generate or client_sw_facts_generate
        
    - fail:
        msg: failed to install {{ package }} package

  when: 
    - package in client_sw_pkgs['packages']
    - state == 'present'
    - not hostvars[inventory_hostname]['sas_client_sw_' + package + '_vers_beg']

# Handle upgrade
- name: upgrade {{ package }}
  block:

    - include_tasks: os/{{ ansible_facts['os_family'] | lower }}/upgrade.yml

    - include_tasks: utils/set_state.yml
      vars:
        flag: act 
        value: upgraded
      when: client_sw_reports_generate or client_sw_facts_generate

  rescue:

    - include_tasks: utils/set_state.yml
      vars:
        flag: act 
        value: failed
      when: client_sw_reports_generate or client_sw_facts_generate

    - fail:
        msg: failed to upgrade {{ package }} package

  when: 
    - package in client_sw_pkgs['packages']
    - state == 'present'
    - hostvars[inventory_hostname]['sas_client_sw_' + package + '_vers_beg'] 
    - hostvars[inventory_hostname]['sas_client_sw_' + package + '_vers_beg'] is version(client_sw_pkgs['packages'][package]['vers'], '<')

# Handle downgrade
- name: downgrade {{ package }}
  block:

    - include_tasks: os/{{ ansible_facts['os_family'] | lower }}/downgrade.yml

    - include_tasks: utils/set_state.yml
      vars:
        flag: act 
        value: downgraded
      when: client_sw_reports_generate or client_sw_facts_generate

  rescue:

    - include_tasks: utils/set_state.yml
      vars:
        flag: act 
        value: failed
      when: client_sw_reports_generate or client_sw_facts_generate

    - fail:
        msg: failed to downgrade {{ package }} package

  when: 
    - package in client_sw_pkgs['packages']
    - state == 'present'
    - hostvars[inventory_hostname]['sas_client_sw_' + package + '_vers_beg'] 
    - hostvars[inventory_hostname]['sas_client_sw_' + package + '_vers_beg'] is version(client_sw_pkgs['packages'][package]['vers'], '>')

# Handle migration (installed version already matches the media, but the package
# is registered in a packaging system that is not the platform's native one).
# The OS version task sets '<pkg>_migrate' true only when such a conversion is
# needed - currently a Solaris 11 host still registered in SVR4 from an older
# release of this collection: the version matches the media so install/upgrade/
# downgrade do not fire, but the package must still be migrated to the native
# IPS package (the OS install task performs the SVR4 removal + IPS install). On
# Solaris 10 the native system is SVR4, so '<pkg>_migrate' is false there and an
# equal-version rerun correctly does nothing.
- name: migrate {{ package }}
  block:

    - include_tasks: os/{{ ansible_facts['os_family'] | lower }}/install.yml

    - include_tasks: utils/set_state.yml
      vars:
        flag: act
        value: upgraded
      when: client_sw_reports_generate or client_sw_facts_generate

  rescue:

    - include_tasks: utils/set_state.yml
      vars:
        flag: act
        value: failed
      when: client_sw_reports_generate or client_sw_facts_generate

    - fail:
        msg: failed to migrate {{ package }} package

  when:
    - package in client_sw_pkgs['packages']
    - state == 'present'
    - hostvars[inventory_hostname]['sas_client_sw_' + package + '_migrate'] | default(false) | bool
    - hostvars[inventory_hostname]['sas_client_sw_' + package + '_vers_beg']
    - hostvars[inventory_hostname]['sas_client_sw_' + package + '_vers_beg'] is version(client_sw_pkgs['packages'][package]['vers'], '==')

# Handle no action 
- include_tasks: utils/set_state.yml
  vars:
    flag: act 
    value: none 
  when:
    - client_sw_reports_generate or client_sw_facts_generate
    - not (hostvars[inventory_hostname]['sas_client_sw_' + package + '_act'] | default('')) 
